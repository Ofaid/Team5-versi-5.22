plugins {
    alias(libs.plugins.android.application)
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) {
    ksFile.withInputStream { ks.load(it) }
}

android {
    enableKotlin = false
    namespace = 'dk.bearware.gui'
    
    // PERBAIKAN SYNTAX: compileSdk version = release(37) -> compileSdk = 37
    compileSdk = 37 
    buildToolsVersion = '37.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId = 'dk.bearware.gui'
        minSdk = 23
        targetSdk = 37
        versionCode = 150
        versionName = '5.22'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        
        // TAMBAHAN PENTING: Filter ABI di level defaultConfig
        // Ini memastikan Gradle & CMake hanya fokus ke arm64-v8a dari awal
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // SIGNING CONFIGS: Pastikan selalu aktif jika file keystore ada
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile = rootProject.file(ks['storeFile'])
                storePassword = ks['storePassword']
                keyAlias = ks['keyAlias']
                keyPassword = ks['keyPassword']
                // WAJIB: Aktifkan V2 & V3 untuk Android 10+
                v2SigningEnabled = true
                v3SigningEnabled = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            if (ks['signDebug']?.toBoolean()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    // PERUBAHAN RADIKAL DI SINI:
    // Hapus universalApk = true
    // Hanya include arm64-v8a
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a' // Hapus armeabi-v7a, x86, x86_64
            universalApk = false // JANGAN Universal!
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [layout.buildDirectory.dir('jniLibs-staging')]
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libTeamTalk5Pro-jni.so']
        }
        pickFirsts = [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE-notice.md'
        ]
    }

    lint {
        disable 'MissingTranslation'
    }
}

tasks.register('syncJniLibs', Sync) {
    from('../../Library/TeamTalkJNI/libs') {
        // PERBAIKAN: Hanya sync arm64-v8a
        include 'arm64-v8a/**'
        // Hapus: 'armeabi-v7a/**', 'x86/**', 'x86_64/**'
    }
    into layout.buildDirectory.dir('jniLibs-staging')
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncJniLibs' }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.gson
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.media
    implementation libs.androidx.preference
    implementation libs.androidx.viewpager
    implementation libs.material
    implementation files('../../Library/TeamTalkJNI/libs/TeamTalk5.jar')

    testImplementation libs.junit.jupiter.api
    testImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')

    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.junit.jupiter.api
    androidTestImplementation files('../../Library/TeamTalkJNI/libs/TeamTalk5Test.jar')
}
