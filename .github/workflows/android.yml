name: TeamTalk5 Android Build (arm64-v8a Only + Cached NDK)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # Setup NDK r29 (Diperlukan agar Gradle bisa menemukan toolchain, 
      # tapi TIDAK akan compile ulang karena kita pakai cache di bawah)
      - name: Set up Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      
      # CACHE NATIVE BUILDS: Ini kuncinya biar ga compile ulang NDK/WebRTC
      - name: Cache Native Builds (WebRTC & Install)
        uses: actions/cache@v4
        with:
          path: |
            ${{runner.workspace}}/webrtc
            ${{runner.workspace}}/install-android
          key: ${{ runner.os }}-native-r29-${{ hashFiles('**/CMakeLists.txt', '**/Makefile', 'Build/**') }}
          restore-keys: |
            ${{ runner.os }}-native-r29-
            ${{ runner.os }}-native-
      
      - name: Install Dependencies
        working-directory: ${{github.workspace}}/Build
        run: sudo make depend-ubuntu24-android
      
      # Build Native Libs (Akan SKIP cepat jika cache hit)
      - name: Build TeamTalk Library (C++)
        working-directory: ${{github.workspace}}/Build
        run: |
          make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-android" \
               CMAKE_BUILD_EXTRA="--target install" android-all
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      - name: Generate Release Keystore
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          keytool -genkeypair -v -keystore release-key.keystore \
            -alias teamtalk-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=TeamTalk, OU=Dev, O=TeamTalk, L=Jakarta, ST=DKI, C=ID"
          cat > keystore.properties <<EOF
          storeFile=release-key.keystore
          storePassword=android123
          keyAlias=teamtalk-release
          keyPassword=android123
          EOF
      
      # GRADLE BUILD: Hanya ambil .so arm64-v8a dari cache, GA COMPILE ULANG C++
      - name: Build arm64-v8a Release APK
        working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
        run: |
          chmod +x gradlew
          # abiFilters memaksa Gradle HANYA package arm64-v8a
          # --no-daemon penting di CI agar memory ga bocor
          ./gradlew assembleRelease --no-daemon -PabiFilters=arm64-v8a
      
      # UPLOAD: HANYA APK FINAL, TIDAK ADA ARTIFACT LAIN
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: TeamTalk5-arm64-v8a-Release
          path: Client/TeamTalkAndroid/build/outputs/apk/release/*.apk
          if-no-files-found: error
